# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/meta.schema.json
#
# Catalogue proxmox-dsoxlab-training, décrit par le contrat v1 de dsoxlab.
#
# Les labs de la formation « Proxmox VE » du blog : un hyperviseur de type 1
# qu'on installe, configure, sécurise et automatise. La cible est Proxmox VE 9,
# bâti sur Debian 13 « trixie ».
#
# POURQUOI CE CATALOGUE EXISTE. La formation comptait 17 leçons et AUCUN
# dispositif de validation, ni quiz ni lab, ce qui viole la règle A du socle.
# Sept signalements d'un lecteur, le 2026-10-23, ont montré ce que cela coûte :
# une commande publiée qui n'a jamais existé dans aucune version, un playbook
# qui rend 403 dès le premier appel, un chiffre de dimensionnement périmé.
# Un guide qui n'est jamais rejoué finit par enseigner ce qui n'existe pas.
#
# CE QU'IL FAUT POUR JOUER CES LABS. Proxmox remplace le noyau de la machine et
# prend la main sur son réseau : il ne s'installe pas sur un poste de travail.
# Les labs tournent donc en VM, et plusieurs demandent la VIRTUALISATION
# IMBRIQUÉE, puisque l'objet du cours est précisément de créer des machines.
#
# UN LAB ENTRE DANS CETTE LISTE LE JOUR OÙ IL EST ÉCRIT ET JOUÉ, PAS AVANT :
# `validate-structure` refuse un lab déclaré dont le `lab.yaml` n'existe pas.
# L'ordre pédagogique est porté par la liste ci-dessous, jamais par les noms de
# lab : on peut insérer un exercice sans renommer les suivants, et un
# identifiant se nomme par son GESTE, jamais par son rang.
#
# `repo.id` sert de clé pour l'état local de ce catalogue : le changer déplace
# ces emplacements.
schema_version: 1

repo:
  id: proxmox-dsoxlab-training
  category: proxmox-dsoxlab-training
  title: "Proxmox VE: install, operate, secure and automate a type 1 hypervisor"
  blog_url: "https://www.stephane-robert.info/docs/virtualiser/type1/proxmox/"
  description: |
    Hands-on labs for the Proxmox VE course: storage backends, networking,
    role-based access control, VM and LXC lifecycle, backups, and automation
    with the Ansible collection and Terraform. Target is Proxmox VE 9 on
    Debian 13.

infra:
  provider: kvm
  network: lab-proxmox
  cidr: 10.10.113.0/24
  hosts:
    # 6 Go et 40 Go : Proxmox installe son noyau, postfix, open-iscsi et
    # chrony, garde deux noyaux le temps de la bascule, et doit encore loger
    # les disques des VM que l'apprenant crée.
    - name: pve.lab
      distro: debian13
      role: debian-family
      ram_mb: 6144
      vcpu: 4
      disk_gb: 40
      # Un second disque, brut, pour les labs de stockage : LVM-thin, ZFS,
      # ajout et retrait de vdev. Sans lui, impossible d'enseigner un pool.
      extra_disk_gb: 20
    # Environnement distinct `proxmox-cluster`, provisionné à la demande par
    # le backend KVM quand un lab cluster démarre. Seul l'apprenant forme le
    # cluster avec pvecm ; aucune adhésion n'est automatisée ici.
    - name: pve01.lab
      distro: debian13
      role: debian-family
      ram_mb: 8192
      vcpu: 4
      disk_gb: 40
      extra_disk_gb: 40
    - name: pve02.lab
      distro: debian13
      role: debian-family
      ram_mb: 8192
      vcpu: 4
      disk_gb: 40
      extra_disk_gb: 40
    - name: pve03.lab
      distro: debian13
      role: debian-family
      ram_mb: 8192
      vcpu: 4
      disk_gb: 40
      extra_disk_gb: 40
  providers:
    kvm:
      libvirt_uri: "qemu:///system"
      bridge_name: "virbr-pmxt"

sections:
  # Teaching order follows the course modules in src/data/parcours/proxmox.yaml.
  # Catalogue presence means authored, not executed or attested.
  - id: concevoir
    title: "Design and qualify the first lab node"
    description: |
      Prepare an isolated lab and connect a guest to its assigned network.
    labs:
      - pve-preparer-laboratoire
      - pve-raccorder-instance

  - id: deployer
    title: "Deploy a node and its first instances"
    description: |
      Install Proxmox VE, from the ISO or on top of Debian 13, and check it
      against a written specification; then create a KVM VM and an
      unprivileged LXC container, build a template, and restore a first service.
    labs:
      - pve-installer-noeud
      - verifier-son-installation
      - pve-suivre-tache
      - pve-creer-vm
      - pve-creer-lxc
      - pve-reparer-agent
      - pve-gerer-cycle-vie
      - pve-construire-template
      - pve-restaurer-premiere-instance
      - pve-epreuve-deploiement

  - id: securiser
    title: "Secure identities and boundaries"
    description: |
      Delegate rights, secure identities and filter management and guest flows.
    labs:
      - pve-deleguer-acces
      - pve-securiser-identites
      - pve-filtrer-flux
      - pve-maitriser-volumes-lxc

  - id: reseaux
    title: "Operate guest networks"
    description: |
      Segment VLANs, route flows and make reversible network changes.
    labs:
      - pve-segmenter-vlan
      - pve-changer-reseau

  - id: proteger-donnees
    title: "Back up and restore with PBS"
    description: |
      Integrate PBS, protect backup keys and prove service recovery.
    labs:
      - pve-integrer-pbs
      - pve-proteger-sauvegardes
      - pve-prouver-restauration

  - id: exploiter
    title: "Observe, diagnose and maintain"
    description: |
      Observe capacity, diagnose an unavailable guest and maintain a node.
    labs:
      - pve-observer-alerter
      - pve-diagnostiquer-instance
      - pve-maintenir-noeud
      - pve-exploiter-thin-pool
      - pve-restaurer-redondance-zfs
      - pve-epreuve-exploitation

  - id: cluster
    title: "Run a cluster and keep it available"
    description: |
      Build a three-node cluster, migrate and replicate guests, test high
      availability against a failure imposed from outside, and recover after
      losing the primary site.
    labs:
      - pve-eprouver-cluster
      - pve-qualifier-stockage-partage
      - pve-migrer-instance
      - pve-reserver-capacite
      - pve-mesurer-replication
      - pve-eprouver-ha
      - pve-maintenir-cluster
      - pve-reprendre-hors-site
      - pve-epreuve-disponibilite

  - id: automatiser
    title: "Automate a reproducible platform"
    description: |
      Drive the API and wait for real results, provision with Terraform under
      measured rights, build a reliable Ansible inventory, and deliver a
      platform that a clean controller can rebuild.
    labs:
      - pve-piloter-api
      - pve-provisionner-terraform
      - pve-reconcilier-etat
      - pve-fiabiliser-inventaire
      - pve-operer-ansible
      - pve-livrer-plateforme
      - pve-epreuve-automatisation

  - id: options
    title: "Options"
    description: |
      Windows with VirtIO, VMware migration, Ceph and SDN.
      Each option is independent, and none of them blocks a level.
    labs:
      - pve-integrer-windows
      - pve-migrer-vmware
      - pve-eprouver-ceph
      - pve-deployer-sdn

# Envoi des preuves vers le compte facultatif du site, par `dsoxlab login` puis
