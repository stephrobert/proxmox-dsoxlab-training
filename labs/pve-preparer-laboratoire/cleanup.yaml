---
- name: Nettoyer les preuves temporaires de pve-preparer-laboratoire
  hosts: lab_target
  become: true
  tasks:
    - name: Arrêter uniquement le QEMU témoin de ce lab
      ansible.builtin.shell: |
        if [ -s /run/lab-proxmox/pve-preparer-laboratoire/preparer-kvm.pid ]; then
          kill "$(cat /run/lab-proxmox/pve-preparer-laboratoire/preparer-kvm.pid)"
        fi
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false
    - name: Retirer le répertoire propre à ce lab
      ansible.builtin.file:
        path: /run/lab-proxmox/pve-preparer-laboratoire
        state: absent
