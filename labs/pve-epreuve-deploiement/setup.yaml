---
- name: Préparer les prérequis attribués à pve-epreuve-deploiement
  hosts: lab_target
  become: true
  vars:
    lab_dir: /opt/lab-proxmox/pve-epreuve-deploiement
    image_name: debian-13-genericcloud-amd64.qcow2
    image_path: /var/lib/vz/template/cache/debian-13-genericcloud-amd64.qcow2
    ct_template: "{{ pve_deployment_ct_template | default('') }}"
    restore_bridge: "{{ pve_deployment_restore_bridge | default('') }}"
  tasks:
    - name: Exiger un nœud déjà installé par l'apprenant
      ansible.builtin.command:
        argv: [pveversion, --verbose]
      register: pve_version
      changed_when: false
      failed_when: pve_version.rc != 0

    - name: Exiger les images et le réseau isolé attribués à l'épreuve
      ansible.builtin.assert:
        that:
          - ct_template is match('^local:vztmpl/debian-13-standard_.*_amd64\\.tar\\.(gz|zst)$')
          - restore_bridge is match('^vmbr[0-9]+$')
          - restore_bridge != 'vmbr0'
        fail_msg: Fournissez le modèle CT Debian vérifié et un bridge isolé différent de vmbr0.

    - name: Vérifier la présence du bridge Linux isolé
      ansible.builtin.stat:
        path: "/sys/class/net/{{ restore_bridge }}/bridge"
      register: bridge_stat

    - name: Refuser un réseau de restauration absent
      ansible.builtin.assert:
        that:
          - bridge_stat.stat.exists
        fail_msg: Le bridge isolé fourni n'existe pas sur le nœud ; aucun réseau ne sera inventé.

    - name: Vérifier le modèle CT Debian attribué
      ansible.builtin.stat:
        path: "/var/lib/vz/template/cache/{{ ct_template | basename }}"
      register: ct_template_stat

    - name: Refuser un modèle CT absent
      ansible.builtin.assert:
        that:
          - ct_template_stat.stat.exists
        fail_msg: Le modèle CT Debian attribué doit être préinstallé sur le stockage local.

    - name: Vérifier que les identifiants de sortie sont libres
      ansible.builtin.command:
        argv: "{{ item.command }}"
      loop:
        - {command: [qm, config, "198"]}
        - {command: [qm, config, "200"]}
        - {command: [pct, config, "201"]}
      register: id_checks
      changed_when: false
      failed_when: false

    - name: Refuser toute collision avec une ressource hors de ce lab
      ansible.builtin.assert:
        that:
          - item.rc != 0
        fail_msg: "L'identifiant {{ item.item.command[2] }} est déjà utilisé ; aucune ressource existante ne sera remplacée."
      loop: "{{ id_checks.results }}"
      loop_control:
        label: "{{ item.item.command[2] }}"

    - name: Réserver les contenus nécessaires sur le stockage local
      ansible.builtin.command:
        argv: [pvesm, set, local, --content, iso,vztmpl,backup,images,rootdir,snippets]
      changed_when: true

    - name: Créer le répertoire de preuves du lab
      ansible.builtin.file:
        path: "{{ lab_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Lire l'empreinte publiée de l'image Debian 13
      ansible.builtin.uri:
        url: https://cloud.debian.org/images/cloud/trixie/latest/SHA512SUMS
        return_content: true
      register: checksums
      retries: 3
      delay: 10
      until: checksums is succeeded

    - name: Extraire l'empreinte de l'image attribuée
      ansible.builtin.set_fact:
        image_sha512: "{{ (checksums.content.splitlines() | select('search', image_name ~ '$') | first).split()[0] }}"

    - name: Télécharger l'image cloud avec sa somme vérifiée
      ansible.builtin.get_url:
        url: "https://cloud.debian.org/images/cloud/trixie/latest/{{ image_name }}"
        dest: "{{ image_path }}"
        checksum: "sha512:{{ image_sha512 }}"
        mode: "0644"
      retries: 3
      delay: 10
      register: image
      until: image is succeeded

    - name: Écrire le manifeste des prérequis attribués
      ansible.builtin.copy:
        dest: "{{ lab_dir }}/manifeste.md"
        owner: root
        group: root
        mode: "0644"
        content: |
          # Ressources attribuées — épreuve de déploiement

          - Nœud : installation Proxmox VE de l'apprenant, vérifiée par `pveversion`
          - VM source : VMID 198
          - CT non privilégié : CTID 201, modèle `{{ ct_template }}`
          - VM restaurée finale : VMID 200
          - Image VM : `{{ image_path }}`, SHA-512 `{{ image_sha512 }}`
          - Stockage de sauvegarde : `local`, sous `/var/lib/vz/dump`
          - Réseau source : `vmbr0`
          - Réseau de restauration isolé : `{{ restore_bridge }}`
          - Le setup n'installe pas Proxmox, ne crée aucune instance et ne configure aucun cluster.
