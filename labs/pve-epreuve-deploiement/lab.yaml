# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: pve-epreuve-deploiement
title: Livrer et restaurer un premier service virtualisé
level: l1
description: À partir d’un nœud vide installé par vos soins, livrer une VM et un CT Linux
  répondant au cahier des charges, puis restaurer les données du service dans une nouvelle
  instance.
skills:
- proxmox
- deployer
- n1
distros:
- debian13
doc_url: https://www.stephane-robert.info/docs/virtualiser/type1/proxmox/
lab_type: lab
difficulty: beginner
estimated_time: 45m
runtime:
  type: vm
  targets:
  - name: pve
    host: pve.lab
    label_en: Proxmox VE node and explicitly assigned guests
    label_fr: Nœud Proxmox VE et invités attribués au lab
  default: pve
validation:
  functional: true
  persistence_after_reboot: false
