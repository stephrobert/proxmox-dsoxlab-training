---
- name: Préparer pve-gerer-cycle-vie
  hosts: lab_target
  become: true
  tasks:
    - name: Disposer d'un nœud Proxmox VE prêt
      ansible.builtin.include_tasks: ../../shared/noeud-proxmox.yml

    - name: Ouvrir le stockage local aux images et extraits du lab
      ansible.builtin.command:
        argv: [pvesm, set, local, --content, iso,vztmpl,backup,images,rootdir,snippets]
      changed_when: true

    - name: Créer le répertoire du lab
      ansible.builtin.file:
        path: /opt/lab-proxmox/pve-gerer-cycle-vie
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Lire l'empreinte publiée de l'image Debian 13
      ansible.builtin.uri:
        url: https://cloud.debian.org/images/cloud/trixie/latest/SHA512SUMS
        return_content: true
      register: sommes
      retries: 3
      delay: 10
      until: sommes is succeeded

    - name: Télécharger l'image cloud avec sa somme vérifiée
      ansible.builtin.get_url:
        url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
        dest: /var/lib/vz/template/cache/debian-13-genericcloud-amd64.qcow2
        checksum: "sha512:{{ (sommes.content.splitlines() | select('search', 'debian-13-genericcloud-amd64.qcow2$') | first).split()[0] }}"
        mode: "0644"
      retries: 3
      delay: 10
      register: image
      until: image is succeeded

    - name: Poser le marqueur de service du témoin avant changement
      ansible.builtin.copy:
        dest: /var/lib/vz/snippets/pve-gerer-cycle-vie.yaml
        owner: root
        group: root
        mode: "0644"
        content: |
          #cloud-config
          hostname: cycle-vie-temoin
          package_update: true
          packages:
            - python3
            - qemu-guest-agent
          write_files:
            - path: /srv/temoin/index.html
              permissions: "0644"
              content: "cycle-vie-avant-changement-195\n"
            - path: /etc/systemd/system/temoin.service
              permissions: "0644"
              content: |
                [Unit]
                Description=Service témoin du cycle de vie
                After=network-online.target
                [Service]
                ExecStart=/usr/bin/python3 -m http.server 8080 --directory /srv/temoin
                [Install]
                WantedBy=multi-user.target
          runcmd:
            - [systemctl, daemon-reload]
            - [systemctl, enable, --now, qemu-guest-agent]
            - [systemctl, enable, --now, temoin.service]

    - name: Examiner la VMID attribuée avant toute modification
      ansible.builtin.command:
        argv: [qm, config, "195"]
      register: vm_config
      changed_when: false
      failed_when: false

    - name: Refuser un VMID déjà pris par une ressource hors de ce lab
      ansible.builtin.assert:
        that:
          - vm_config.rc != 0 or 'dsoxlab-lab=pve-gerer-cycle-vie' in vm_config.stdout
        fail_msg: La VMID 195 existe sans marqueur de propriété de ce lab ; aucune modification effectuée.

    - name: Créer la VM de départ plus petite que la cible
      ansible.builtin.command:
        argv:
          - qm
          - create
          - "195"
          - --name
          - cycle-vie-temoin
          - --description
          - dsoxlab-lab=pve-gerer-cycle-vie
          - --machine
          - q35
          - --cpu
          - host
          - --cores
          - "1"
          - --memory
          - "1024"
          - --net0
          - virtio,bridge=vmbr0
          - --scsihw
          - virtio-scsi-pci
          - --scsi0
          - local:0,import-from=/var/lib/vz/template/cache/debian-13-genericcloud-amd64.qcow2,format=qcow2
          - --ide2
          - local:cloudinit
          - --cicustom
          - user=local:snippets/pve-gerer-cycle-vie.yaml
          - --ipconfig0
          - ip=dhcp
          - --boot
          - order=scsi0
          - --agent
          - enabled=1
      when: vm_config.rc != 0
      changed_when: true

    - name: Limiter le disque initial à 4 Gio
      ansible.builtin.command:
        argv: [qm, disk, resize, "195", scsi0, 4G]
      when: vm_config.rc != 0
      changed_when: true

    - name: Démarrer le témoin de départ
      ansible.builtin.command:
        argv: [qm, start, "195"]
      register: demarrage
      changed_when: demarrage.rc == 0
      failed_when: demarrage.rc != 0 and 'already running' not in demarrage.stderr

    - name: Attendre la disponibilité du service témoin initial
      ansible.builtin.command:
        argv: [qm, guest, exec, "195", --, systemctl, is-active, temoin.service]
      register: temoin
      retries: 60
      delay: 10
      until: temoin.rc == 0 and 'active' in temoin.stdout
      changed_when: false

    - name: Écrire le manifeste des ressources attribuées
      ansible.builtin.copy:
        dest: /opt/lab-proxmox/pve-gerer-cycle-vie/manifeste.md
        owner: root
        group: root
        mode: "0644"
        content: |
          # Ressources attribuées — cycle de vie

          - VMID : 195, propriété : `dsoxlab-lab=pve-gerer-cycle-vie`
          - État initial : 1 vCPU, 1024 Mio, disque système de 4 Gio
          - Cible : 2 vCPU, 2048 Mio, disque système de 8 Gio
          - Instantané de retour à créer avant les changements : `avant-changement`
          - Service témoin : `http://<adresse-DHCP>:8080/`
          - Marqueur de départ : `cycle-vie-avant-changement-195`
          - Disque, snapshot et mémoire sont limités à cette VM attribuée.
