id: pve-gerer-cycle-vie
title: Resize a VM and prove a local rollback
level: l1
description: The application VM is running with 1 vCPU, 1024 MiB RAM and a 4 GiB system disk. Preserve a local return
  point before allocating 2 vCPUs, 2048 MiB RAM and an 8 GiB disk. Extend the partition and filesystem inside Debian
  as well. The original witness, guest agent and static network are supplied.
skills:
- proxmox
- deployer
- n1
distros:
- debian13
doc_url: https://www.stephane-robert.info/docs/virtualiser/type1/proxmox/
lab_type: lab
difficulty: beginner
estimated_time: 45m
runtime:
  type: vm
  targets:
  - name: pve
    host: pve.lab
    label_en: Proxmox VE node and explicitly assigned guests
    label_fr: Nœud Proxmox VE et invités attribués au lab
  default: pve
validation:
  functional: true
  persistence_after_reboot: true
