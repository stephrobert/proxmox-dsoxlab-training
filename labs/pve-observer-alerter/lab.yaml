# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: pve-observer-alerter
title: Observe capacity and receive alerts
level: l2
description: 'Monitor a service and its critical resources, trigger an alert, and
  resolve it. Assigned scope: Live PVE node metrics; local receiver and bounded guest
  load are supplied externally; no guest or receiver is created. Tests inspect native
  Proxmox state; no Proxmox or cluster provisioning is performed.'
skills:
- proxmox
- operations
- security
distros: [debian13]
doc_url: https://www.stephane-robert.info/docs/virtualiser/type1/proxmox/
lab_type: lab
difficulty: intermediate
estimated_time: 60m
runtime:
  type: vm
  targets:
  - name: pve
    host: pve.lab
    label_en: Pre-installed Proxmox VE target; no cluster changes
    label_fr: Cible Proxmox VE préinstallée ; aucune modification du cluster
  default: pve
validation:
  functional: true
  persistence_after_reboot: false
