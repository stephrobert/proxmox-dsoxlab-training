---
- name: Remove only this lab's manifest directory for pve-observer-alerter
  hosts: lab_target
  become: true
  vars:
    lab_dir: /opt/lab-proxmox/pve-observer-alerter
  tasks:
    - name: Require this lab's exact ownership manifest
      ansible.builtin.stat:
        path: "{{ lab_dir }}/manifest.yml"
      register: manifest
    - name: Refuse cleanup without the ownership marker
      ansible.builtin.assert:
        that:
          - manifest.stat.exists
        fail_msg: 'Lab manifest is absent; refusing to remove any external PVE resource.'
    - name: Remove only the notification matcher owned by this lab
      ansible.builtin.command: pvesh delete /cluster/notifications/matchers/lab-n2-210
      register: matcher_remove
      changed_when: matcher_remove.rc == 0
      failed_when: false
    - name: Remove only the local notification target owned by this lab
      ansible.builtin.command: pvesh delete /cluster/notifications/targets/sendmail/lab-n2-210
      register: target_remove
      changed_when: target_remove.rc == 0
      failed_when: false
    - name: Remove only this lab's manifest directory
      ansible.builtin.file:
        path: "{{ lab_dir }}"
        state: absent
