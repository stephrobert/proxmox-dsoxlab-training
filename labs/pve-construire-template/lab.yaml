id: pve-construire-template
title: Build a cloud-init template and independent clones
level: l1
description: The preparation provides a Debian 13 cloud image with its published SHA-512, a vendor snippet that
  installs the witness service, and two separate SSH client keys. It creates no template or clone. Use VM 197 for
  the template and VMs 198 and 199 for the clones. Keep one vCPU and 768 MiB RAM per clone, gateway and DNS 10.10.113.1,
  and bridge vmbr0. These bounds preserve room for the evaluator’s probe.
skills:
- proxmox
- deployer
- n1
distros:
- debian13
doc_url: https://www.stephane-robert.info/docs/virtualiser/type1/proxmox/
lab_type: lab
difficulty: beginner
estimated_time: 45m
runtime:
  type: vm
  targets:
  - name: pve
    host: pve.lab
    label_en: Proxmox VE node and explicitly assigned guests
    label_fr: Nœud Proxmox VE et invités attribués au lab
  default: pve
validation:
  functional: true
  persistence_after_reboot: false
