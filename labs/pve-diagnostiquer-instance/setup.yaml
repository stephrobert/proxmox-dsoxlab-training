---
- name: Inject the assigned bridge fault on the disposable diagnostic VM
  hosts: lab_target
  become: true
  vars:
    lab_dir: /opt/lab-proxmox/pve-diagnostiquer-instance
    vmid: 211
  tasks:
    - name: Require an already-installed Proxmox VE node
      ansible.builtin.command: pveversion --verbose
      changed_when: false
      register: pve_version
      failed_when: pve_version.rc != 0 or 'pve-manager' not in pve_version.stdout
    - name: Read the pre-provisioned disposable guest
      ansible.builtin.command: qm config {{ vmid }}
      register: vm_config
      changed_when: false
      failed_when: false
    - name: Require the dedicated guest, disk, guest agent, and firewall
      ansible.builtin.assert:
        that:
          - vm_config.rc == 0
          - "'name: n2-diagnostique' in vm_config.stdout"
          - "'scsi0:' in vm_config.stdout"
          - "'agent: enabled=1' in vm_config.stdout"
          - "'firewall=1' in vm_config.stdout"
        fail_msg: 'BLOCKED: provision the disposable VMID 211 named n2-diagnostique with its data disk, guest agent, firewall, and vmbr0 NIC. This setup will not install a guest or adopt another VM.'
    - name: Inject only the documented wrong bridge
      ansible.builtin.command: qm set {{ vmid }} --net0 virtio,bridge=vmbr999,firewall=1
      changed_when: true
    - name: Write the exact diagnostic fixture manifest
      ansible.builtin.copy:
        dest: "{{ lab_dir }}/manifest.yml"
        owner: root
        group: root
        mode: '0640'
        content: |
          lab: pve-diagnostiquer-instance
          allocated: VMID 211; VM name n2-diagnostique; single injected fault: net0 bridge vmbr999
          pve_node_required: true
          cluster_changes: forbidden
          physical_network_changes: forbidden
          external_prerequisite: pre-provisioned disposable VM with data disk, guest agent and firewall
