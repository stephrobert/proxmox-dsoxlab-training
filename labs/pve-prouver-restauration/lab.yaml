# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: pve-prouver-restauration
title: Restore a service and measure recovery objectives
level: l2
description: 'Recover an application from PBS with the source unavailable and produce
  a verifiable recovery report. Assigned scope: Empty recovery VMID 209 reserved for
  a restored VM named n2-restored-209; PBS storage lab-pbs-n2-209, evaluator-owned
  backup/journal, and isolated recovery network. Tests inspect native Proxmox state;
  no Proxmox or cluster provisioning is performed.'
skills:
- proxmox
- operations
- security
distros: [debian13]
doc_url: https://www.stephane-robert.info/docs/virtualiser/type1/proxmox/
lab_type: lab
difficulty: intermediate
estimated_time: 60m
runtime:
  type: vm
  targets:
  - name: pve
    host: pve.lab
    label_en: Pre-installed Proxmox VE target; no cluster changes
    label_fr: Cible Proxmox VE préinstallée ; aucune modification du cluster
  default: pve
validation:
  functional: true
  persistence_after_reboot: false
