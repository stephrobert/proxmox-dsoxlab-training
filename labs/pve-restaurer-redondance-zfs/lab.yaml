# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: pve-restaurer-redondance-zfs
title: Restore ZFS mirror redundancy
level: l2
description: 'Keep a service running on a degraded lab mirror and return the pool
  to healthy redundancy. Assigned scope: Dedicated disposable two-device ZFS pool
  labmirror-n2-214 and evaluator-owned corpus; setup does not create or degrade a
  pool. Tests inspect native Proxmox state; no Proxmox or cluster provisioning is
  performed.'
skills:
- proxmox
- operations
- security
distros: [debian13]
doc_url: https://www.stephane-robert.info/docs/virtualiser/type1/proxmox/
lab_type: lab
difficulty: intermediate
estimated_time: 60m
runtime:
  type: vm
  targets:
  - name: pve
    host: pve.lab
    label_en: Pre-installed Proxmox VE target; no cluster changes
    label_fr: Cible Proxmox VE préinstallée ; aucune modification du cluster
  default: pve
validation:
  functional: true
  persistence_after_reboot: false
