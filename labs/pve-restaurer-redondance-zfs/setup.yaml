---
- name: Preflight the assigned external state for pve-restaurer-redondance-zfs
  hosts: lab_target
  become: true
  vars:
    lab_dir: /opt/lab-proxmox/pve-restaurer-redondance-zfs
  tasks:
    - name: Require an already-installed Proxmox VE node
      ansible.builtin.command: pveversion --verbose
      changed_when: false
      register: pve_version
      failed_when: pve_version.rc != 0 or 'pve-manager' not in pve_version.stdout
    - name: Require the exact assigned disposable mirror
      ansible.builtin.command: zpool status -P labmirror-n2-214
      register: pool
      changed_when: false
      failed_when: pool.rc != 0 or 'mirror-' not in pool.stdout
    - name: Create this lab's evidence directory
      ansible.builtin.file:
        path: "{{ lab_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0750'
    - name: Write the exact external fixture manifest
      ansible.builtin.copy:
        dest: "{{ lab_dir }}/manifest.yml"
        owner: root
        group: root
        mode: '0640'
        content: |
          lab: pve-restaurer-redondance-zfs
          allocated: Dedicated two-device pool labmirror-n2-214 and evaluator-owned corpus; setup does not create, degrade or replace a pool.
          pve_node_required: true
          cluster_changes: forbidden
          physical_network_changes: forbidden
          external_prerequisite: must be supplied by the approved lab inventory
