---
# Guarded, bounded fixture only. This playbook never installs Proxmox VE.
- name: Préparer pve-fiabiliser-inventaire
  hosts: lab_target
  become: true
  tasks:
    - name: Vérifier une installation PVE préexistante
      ansible.builtin.command: pveversion --verbose
      register: pve_version
      changed_when: false
      failed_when: false
    - name: Bloquer clairement sur Debian nu ou sans PVE
      ansible.builtin.assert:
        that: pve_version.rc == 0
        fail_msg: "BLOCKED: an already-installed Proxmox VE node is required; this lab never installs PVE."

    - name: Vérifier la présence de l’outil d’inventaire Ansible
      ansible.builtin.command: ansible-inventory --version
      register: ansible_tool
      changed_when: false
      failed_when: false
    - name: Bloquer sans ansible-inventory
      ansible.builtin.assert:
        that: ansible_tool.rc == 0
        fail_msg: "BLOCKED: install/configure Ansible on the lab controller; setup does not install it."

    - name: Refuser tout VMID déjà utilisé
      ansible.builtin.command: "qm status {{ item }}"
      loop: [1739, 1740]
      register: vmid_checks
      changed_when: false
      failed_when: false
    - name: Bloquer en cas de collision de VMID
      ansible.builtin.assert:
        that: "vmid_checks.results | selectattr('rc', 'equalto', 0) | list | length == 0"
        fail_msg: "BLOCKED: a reserved lab VMID is already in use; cleanup never deletes pre-existing VMs."
    - name: Créer uniquement les VM témoins attribuées à ce lab
      ansible.builtin.command: >-
        qm create {{ item }} --name pve-fiabiliser-inventaire-{{ item }} --ostype l26
        --cores 1 --memory 512 --scsihw virtio-scsi-single
        --scsi0 local:1,format=qcow2 --net0 virtio,bridge=vmbr0
        --tags pve-fiabiliser-inventaire
      loop: [1739, 1740]
      changed_when: true

    - name: Créer le répertoire dédié
      ansible.builtin.file:
        path: /opt/lab-proxmox/pve-fiabiliser-inventaire
        state: directory
        owner: root
        group: root
        mode: '0750'
    - name: Écrire le manifeste borné
      ansible.builtin.copy:
        dest: /opt/lab-proxmox/pve-fiabiliser-inventaire/manifest.json
        owner: root
        group: root
        mode: '0640'
        content: '{{ {"lab": "pve-fiabiliser-inventaire", "vmids": [1739, 1740], "template_vmid": 9000} | to_json }}'
