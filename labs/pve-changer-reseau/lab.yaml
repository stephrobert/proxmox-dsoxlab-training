# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: pve-changer-reseau
title: Route, publish, and change networking safely
level: l2
description: 'Configure outbound access and one controlled published service, then
  make a reversible network change. Assigned scope: VMID 206; isolated bridge vmbr206;
  nftables chain N2LAB206; no physical uplink or default route is assigned. Tests
  inspect native Proxmox state; no Proxmox or cluster provisioning is performed.'
skills:
- proxmox
- operations
- security
distros: [debian13]
doc_url: https://www.stephane-robert.info/docs/virtualiser/type1/proxmox/
lab_type: lab
difficulty: intermediate
estimated_time: 60m
runtime:
  type: vm
  targets:
  - name: pve
    host: pve.lab
    label_en: Pre-installed Proxmox VE target; no cluster changes
    label_fr: Cible Proxmox VE préinstallée ; aucune modification du cluster
  default: pve
validation:
  functional: true
  persistence_after_reboot: false
