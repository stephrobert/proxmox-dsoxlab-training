# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: pve-segmenter-vlan
title: Segment and diagnose VLANs
level: l2
description: 'Build two segments and permit one explicit routed exception without
  exposing management. Assigned scope: VMID 205; isolated bridge vmbr205 and VLAN
  IDs 285/286; no physical uplink is assigned. Tests inspect native Proxmox state;
  no Proxmox or cluster provisioning is performed.'
skills:
- proxmox
- operations
- security
distros: [debian13]
doc_url: https://www.stephane-robert.info/docs/virtualiser/type1/proxmox/
lab_type: lab
difficulty: intermediate
estimated_time: 60m
runtime:
  type: vm
  targets:
  - name: pve
    host: pve.lab
    label_en: Pre-installed Proxmox VE target; no cluster changes
    label_fr: Cible Proxmox VE préinstallée ; aucune modification du cluster
  default: pve
validation:
  functional: true
  persistence_after_reboot: false
