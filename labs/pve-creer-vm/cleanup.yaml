---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que le lab a
# posé, VM comprise, pour que le lab se rejoue à l'identique.
#
# Il ne touche qu'aux ressources que le manifeste attribue au lab : la VM 150,
# l'extrait cloud-init de la solution et le répertoire du lab. L'ISO et le
# nœud restent : les labs suivants s'en servent.
- name: Défaire le lab pve-creer-vm
  hosts: lab_target
  become: true
  vars:
    vmid: 150
  tasks:
    - name: Mesurer si la VM du lab existe
      ansible.builtin.command: qm status {{ vmid }}
      register: existe
      changed_when: false
      failed_when: false

    - name: Arrêter la VM du lab
      ansible.builtin.command: qm stop {{ vmid }} --skiplock 1
      when: existe.rc == 0
      changed_when: true
      failed_when: false

    - name: Détruire la VM du lab et ses disques
      ansible.builtin.command: qm destroy {{ vmid }} --purge 1 --destroy-unreferenced-disks 1
      when: existe.rc == 0
      changed_when: true

    - name: Retirer l'extrait cloud-init de la solution
      ansible.builtin.file:
        path: /var/lib/vz/snippets/pve-creer-vm.yaml
        state: absent

    - name: Retirer le répertoire du lab
      ansible.builtin.file:
        path: /opt/lab-proxmox/pve-creer-vm
        state: absent
