---
- name: Prepare bounded fixture for pve-deleguer-acces
  hosts: lab_target
  become: true
  vars:
    lab_id: pve-deleguer-acces
    lab_dir: /opt/lab-proxmox/pve-deleguer-acces
    vmid: 201
    vm_name: n2-delegueracc
  tasks:
    - name: Require an already-installed Proxmox VE node
      ansible.builtin.command: pveversion --verbose
      changed_when: false
      register: pve_version
      failed_when: pve_version.rc != 0 or 'pve-manager' not in pve_version.stdout
    - name: Check for an existing ownership manifest
      ansible.builtin.stat:
        path: "{{ lab_dir }}/manifest.yml"
      register: existing_manifest
    - name: Create the lab evidence directory
      ansible.builtin.file:
        path: "{{ lab_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0750'
    - name: Check whether the exact allocated VM already exists
      ansible.builtin.command: qm config {{ vmid }}
      register: vm_config
      changed_when: false
      failed_when: false
    - name: Refuse to reuse an occupied VMID
      ansible.builtin.assert:
        that:
          - "vm_config.rc != 0 or (existing_manifest.stat.exists and ('name: ' ~ vm_name) in vm_config.stdout)"
        fail_msg: 'Allocated VMID {{ vmid }} is occupied by a different resource; stop without changing it.'
    - name: Create an inert fixture VM only when this lab owns the VMID
      ansible.builtin.command: >-
        qm create {{ vmid }} --name {{ vm_name }} --memory 512 --cores 1
        --net0 virtio,bridge=vmbr0 --onboot 0
      when: vm_config.rc != 0
      changed_when: true
    - name: Read current PVE pool inventory
      ansible.builtin.command: pveum pool list --output-format json
      register: pools
      changed_when: false
    - name: Refuse to adopt pre-existing lab pool names
      ansible.builtin.assert:
        that:
          - existing_manifest.stat.exists or ('lab-n2-deleguer' not in pools.stdout and 'lab-n2-voisin' not in pools.stdout)
        fail_msg: 'A lab pool name is already in use; refusing to adopt it.'
    - name: Create the assigned pool when absent
      ansible.builtin.command: pveum pool add lab-n2-deleguer
      when: "'lab-n2-deleguer' not in pools.stdout"
      changed_when: true
    - name: Create the neighbouring pool when absent
      ansible.builtin.command: pveum pool add lab-n2-voisin
      when: "'lab-n2-voisin' not in pools.stdout"
      changed_when: true
    - name: Check the neighbouring sentinel VM
      ansible.builtin.command: qm config 216
      register: voisin_config
      changed_when: false
      failed_when: false
    - name: Refuse to reuse another resource's VMID
      ansible.builtin.assert:
        that:
          - voisin_config.rc != 0 or (existing_manifest.stat.exists and 'name: n2-voisin' in voisin_config.stdout)
        fail_msg: 'VMID 216 is occupied by a resource not owned by this lab.'
    - name: Create the neighbouring sentinel only when absent
      ansible.builtin.command: >-
        qm create 216 --name n2-voisin --memory 512 --cores 1
        --net0 virtio,bridge=vmbr0 --onboot 0
      when: voisin_config.rc != 0
      changed_when: true
    - name: Put each sentinel in its dedicated pool
      ansible.builtin.command: pveum pool modify {{ item.pool }} --vms {{ item.vmid }}
      loop:
        - { pool: lab-n2-deleguer, vmid: 201 }
        - { pool: lab-n2-voisin, vmid: 216 }
      changed_when: true
    - name: Read existing lab identities
      ansible.builtin.command: pveum user list --output-format json
      register: users
      changed_when: false
    - name: Refuse to adopt pre-existing test identities
      ansible.builtin.assert:
        that:
          - existing_manifest.stat.exists or ('equipe-n2@pve' not in users.stdout and 'auditeur-n2@pve' not in users.stdout and 'secours-n2@pve' not in users.stdout)
        fail_msg: 'A lab identity name is already in use; refusing to adopt it.'
    - name: Create the three named test accounts when absent
      ansible.builtin.command: pveum user add {{ item }} --comment 'N2 delegated-access lab'
      loop:
        - equipe-n2@pve
        - auditeur-n2@pve
        - secours-n2@pve
      when: item not in users.stdout
      changed_when: true
    - name: Write the exact resource manifest
      ansible.builtin.copy:
        dest: "{{ lab_dir }}/manifest.yml"
        owner: root
        group: root
        mode: '0640'
        content: |
          lab: pve-deleguer-acces
          allocated: VMIDs 201/n2-delegueracc and 216/n2-voisin; pools lab-n2-deleguer/lab-n2-voisin; accounts equipe-n2@pve, auditeur-n2@pve, secours-n2@pve. No disks, guest IPs, or physical NICs are assigned.
          pve_node_required: true
          cluster_changes: forbidden
          physical_network_changes: forbidden
          external_prerequisite: none beyond the pre-installed PVE node
