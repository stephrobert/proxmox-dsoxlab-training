---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que le lab a
# posé, pour que le lab se rejoue à l'identique. Il ne touche qu'aux
# ressources du lab : la VM 160, le pont isolé vmbr9, l'extrait cloud-init et
# le répertoire du lab. Le nœud et l'image cloud restent.
- name: Défaire le lab pve-raccorder-instance
  hosts: lab_target
  become: true
  vars:
    vmid: 160
  tasks:
    - name: Mesurer si la VM du lab existe
      ansible.builtin.command: qm status {{ vmid }}
      register: existe
      changed_when: false
      failed_when: false

    - name: Arrêter la VM du lab
      ansible.builtin.command: qm stop {{ vmid }} --skiplock 1
      when: existe.rc == 0
      changed_when: true
      failed_when: false

    - name: Détruire la VM du lab et ses disques
      ansible.builtin.command: qm destroy {{ vmid }} --purge 1 --destroy-unreferenced-disks 1
      when: existe.rc == 0
      changed_when: true

    - name: Retirer la déclaration du pont isolé
      ansible.builtin.blockinfile:
        path: /etc/network/interfaces
        marker: "# {mark} lab pve-raccorder-instance"
        state: absent

    - name: Créer le répertoire du verrou d'ifupdown2
      ansible.builtin.file:
        path: /run/network
        state: directory
        mode: "0755"

    - name: Appliquer la configuration réseau sans le pont isolé
      ansible.builtin.command: ifreload -a
      changed_when: true

    - name: Retirer l'extrait cloud-init du lab
      ansible.builtin.file:
        path: /var/lib/vz/snippets/pve-raccorder-instance.yaml
        state: absent

    - name: Retirer le répertoire du lab
      ansible.builtin.file:
        path: /opt/lab-proxmox/pve-raccorder-instance
        state: absent
