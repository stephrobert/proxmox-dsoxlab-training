id: pve-restaurer-premiere-instance
title: Back up and restore a first VM on an isolated network
level: l1
description: 'Source VM 198 already serves a session-specific witness on 10.10.113.198:8080. The preparation supplies
  isolated bridge vmbr9 and client namespace dsox-restore (10.10.113.240/24). Back up to /var/lib/vz/dump/pve-restaurer-premiere-instance
  and restore to VM 199. Keep the restored guest IP unchanged: the source and restore use different Ethernet segments.
  Do not connect the isolated bridge to the host network.'
skills:
- proxmox
- deployer
- n1
distros:
- debian13
doc_url: https://www.stephane-robert.info/docs/virtualiser/type1/proxmox/
lab_type: lab
difficulty: beginner
estimated_time: 45m
runtime:
  type: vm
  targets:
  - name: pve
    host: pve.lab
    label_en: Proxmox VE node and explicitly assigned guests
    label_fr: Nœud Proxmox VE et invités attribués au lab
  default: pve
validation:
  functional: true
  persistence_after_reboot: true
