---
- name: Préparer le témoin et les ressources attribuées à pve-restaurer-premiere-instance
  hosts: lab_target
  become: true
  vars:
    lab_dir: /opt/lab-proxmox/pve-restaurer-premiere-instance
    source_id: 198
    restored_id: 199
    image_name: debian-13-genericcloud-amd64.qcow2
    image_path: /var/lib/vz/template/cache/debian-13-genericcloud-amd64.qcow2
    restore_bridge: "{{ pve_restore_bridge | default('') }}"
  tasks:
    - name: Disposer d'un nœud Proxmox VE prêt
      ansible.builtin.include_tasks: ../../shared/noeud-proxmox.yml

    - name: Exiger le bridge de restauration isolé attribué par l'instructeur
      ansible.builtin.assert:
        that:
          - restore_bridge is match('^vmbr[0-9]+$')
        fail_msg: Fournissez pve_restore_bridge avec le bridge isolé réservé à la restauration.

    - name: Vérifier que le bridge de restauration est bien un bridge Linux
      ansible.builtin.stat:
        path: "/sys/class/net/{{ restore_bridge }}/bridge"
      register: bridge_stat

    - name: Refuser un bridge absent ou non isolé de l'infrastructure
      ansible.builtin.assert:
        that:
          - bridge_stat.stat.exists
          - restore_bridge != 'vmbr0'
        fail_msg: Le bridge isolé attribué doit exister et être différent du réseau source vmbr0.

    - name: Réserver les contenus nécessaires sur le stockage local
      ansible.builtin.command:
        argv: [pvesm, set, local, --content, iso,vztmpl,backup,images,rootdir,snippets]
      changed_when: true

    - name: Créer le répertoire du lab
      ansible.builtin.file:
        path: "{{ lab_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Lire l'empreinte publiée de l'image Debian 13
      ansible.builtin.uri:
        url: https://cloud.debian.org/images/cloud/trixie/latest/SHA512SUMS
        return_content: true
      register: checksums
      retries: 3
      delay: 10
      until: checksums is succeeded

    - name: Extraire l'empreinte de l'image attribuée
      ansible.builtin.set_fact:
        image_sha512: "{{ (checksums.content.splitlines() | select('search', image_name ~ '$') | first).split()[0] }}"

    - name: Télécharger l'image cloud avec sa somme vérifiée
      ansible.builtin.get_url:
        url: "https://cloud.debian.org/images/cloud/trixie/latest/{{ image_name }}"
        dest: "{{ image_path }}"
        checksum: "sha512:{{ image_sha512 }}"
        mode: "0644"
      retries: 3
      delay: 10
      register: image
      until: image is succeeded

    - name: Préparer le marqueur de service de la source
      ansible.builtin.copy:
        dest: /var/lib/vz/snippets/pve-restore-witness.yaml
        owner: root
        group: root
        mode: "0644"
        content: |
          #cloud-config
          hostname: restore-source
          package_update: true
          packages:
            - python3
            - qemu-guest-agent
          write_files:
            - path: /srv/witness/index.html
              permissions: "0644"
              content: "restored-marker-from-source-198\n"
            - path: /etc/systemd/system/witness.service
              permissions: "0644"
              content: |
                [Unit]
                Description=Restore lab witness
                After=network-online.target
                [Service]
                ExecStart=/usr/bin/python3 -m http.server 8080 --directory /srv/witness
                [Install]
                WantedBy=multi-user.target
          runcmd:
            - [systemctl, daemon-reload]
            - [systemctl, enable, --now, qemu-guest-agent]
            - [systemctl, enable, --now, witness.service]

    - name: Examiner la VM source attribuée
      ansible.builtin.command:
        argv: [qm, config, "{{ source_id }}"]
      register: source_config
      changed_when: false
      failed_when: false

    - name: Examiner le VMID de restauration
      ansible.builtin.command:
        argv: [qm, config, "{{ restored_id }}"]
      register: restored_config
      changed_when: false
      failed_when: false

    - name: Refuser toute collision de VMID avec une ressource hors de ce lab
      ansible.builtin.assert:
        that:
          - source_config.rc != 0 or 'dsoxlab-lab=pve-restaurer-premiere-instance' in source_config.stdout
          - restored_config.rc != 0
        fail_msg: Un VMID attribué est déjà utilisé par une ressource non attribuée au lab.

    - name: Créer la VM source marquée sur le réseau d'origine
      ansible.builtin.command:
        argv:
          - qm
          - create
          - "{{ source_id }}"
          - --name
          - restore-source
          - --description
          - dsoxlab-lab=pve-restaurer-premiere-instance
          - --machine
          - q35
          - --cpu
          - host
          - --cores
          - "1"
          - --memory
          - "1024"
          - --net0
          - virtio,bridge=vmbr0
          - --scsihw
          - virtio-scsi-pci
          - --scsi0
          - "local:0,import-from={{ image_path }},format=qcow2"
          - --ide2
          - local:cloudinit
          - --cicustom
          - user=local:snippets/pve-restore-witness.yaml
          - --boot
          - order=scsi0
          - --agent
          - enabled=1
      when: source_config.rc != 0
      changed_when: true

    - name: Démarrer le témoin de la VM source
      ansible.builtin.command:
        argv: [qm, start, "{{ source_id }}"]
      register: source_start
      changed_when: source_start.rc == 0
      failed_when: source_start.rc != 0 and 'already running' not in source_start.stderr

    - name: Attendre que le service témoin soit initialisé avant le backup
      ansible.builtin.command:
        argv: [qm, guest, exec, "{{ source_id }}", --, systemctl, is-active, witness.service]
      register: witness
      retries: 60
      delay: 10
      until: witness.rc == 0 and 'active' in witness.stdout
      changed_when: false

    - name: Écrire le manifeste des ressources attribuées
      ansible.builtin.copy:
        dest: "{{ lab_dir }}/manifeste.md"
        owner: root
        group: root
        mode: "0644"
        content: |
          # Ressources attribuées — sauvegarde et restauration

          - Source : VMID 198, propriété `dsoxlab-lab=pve-restaurer-premiere-instance`, bridge `vmbr0`
          - Restauration : VMID 199, à créer depuis l'archive
          - Image source : `{{ image_path }}`, SHA-512 `{{ image_sha512 }}`
          - Archive : stockage `local`, sous `/var/lib/vz/dump`
          - Réseau de restauration isolé : `{{ restore_bridge }}`
          - Service source : HTTP sur le port 8080
          - Marqueur à restaurer : `restored-marker-from-source-198`
          - Le CT mentionné dans les autres parcours n'est pas attribué dans cet exercice.
