---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
#
# CE QUE CE NETTOYAGE NE FAIT PAS, volontairement : désinstaller Proxmox. Les
# paquets, les services, le pont vmbr0 et les dépôts ajoutés restent en place.
#
# Deux raisons. D'abord, désinstaller proprement Proxmox d'un Debian est un
# geste long et faillible : le résultat ne serait pas une Debian nue, mais une
# Debian abîmée, sur laquelle le lab suivant partirait de travers. Ensuite,
# dsoxlab sait faire mieux : `dsoxlab clean` rend une machine neuve.
#
# Pour recommencer le lab depuis une vraie Debian 13 nue, détruisez donc la
# machine et reprovisionnez-la, ce que le scénario explique.
- name: Défaire le lab verifier-son-installation
  hosts: lab_target
  become: true
  tasks:

    - name: Retirer le répertoire de travail et son cahier des charges
      ansible.builtin.file:
        path: /opt/lab-proxmox
        state: absent

    - name: Rappeler comment repartir d'une machine vierge
      ansible.builtin.debug:
        msg: >-
          Consigne retirée. Proxmox, s'il a été installé, reste en place : ce
          nettoyage ne désinstalle rien, car une Debian dont on a arraché
          Proxmox n'est pas une Debian nue. Pour refaire le lab depuis zéro,
          reprovisionnez la machine.
