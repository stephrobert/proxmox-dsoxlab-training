# Surcharge française du lab verifier-son-installation. Elle ne porte QUE `title` et
# `description` : tout autre champ y est ignoré en silence, parce que le
# contrat ne se traduit pas.
title: "Vérifier votre installation de Proxmox face au cahier des charges"
description: |
  Noter une installation de Proxmox VE 9 que vous avez faite vous-même, face au
  cahier des charges publié : version installée, chaque service Proxmox,
  HTTPS, adresse du serveur sur vmbr0, dépôt sans abonnement actif et
  téléchargement des index APT. Debian, le dimensionnement du nœud, la
  virtualisation imbriquée et le second disque brut sont des prérequis fournis,
  vérifiés à la préparation et non notés. Chaque propriété en défaut a son verdict.
