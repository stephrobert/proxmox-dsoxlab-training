---
# Guarded, bounded fixture only. This playbook never installs Proxmox VE.
- name: Préparer pve-integrer-windows
  hosts: lab_target
  become: true
  tasks:
    - name: Vérifier une installation PVE préexistante
      ansible.builtin.command: pveversion --verbose
      register: pve_version
      changed_when: false
      failed_when: false
    - name: Bloquer clairement sur Debian nu ou sans PVE
      ansible.builtin.assert:
        that: pve_version.rc == 0
        fail_msg: "BLOCKED: an already-installed Proxmox VE node is required; this lab never installs PVE."

    - name: Vérifier la configuration de licence et les deux ISO officielles
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/lib/vz/template/iso/windows-authorized.iso
        - /var/lib/vz/template/iso/virtio-win.iso
      register: medias
    - name: Vérifier l’autorisation administrative de licence
      ansible.builtin.stat:
        path: /etc/lab-proxmox/windows-license-authorized
      register: license_authorization
    - name: Bloquer si licence ou médias requis absents
      ansible.builtin.assert:
        that:
          - medias.results | length == 2
          - medias.results | map(attribute='stat.exists') | select('equalto', true) | list | length == 2
          - license_authorization.stat.exists
          - license_authorization.stat.mode == '0600'
        fail_msg: "BLOCKED: provide a licensed Windows ISO, official VirtIO ISO and administrator license authorization; no bypass is provided."

    - name: Refuser tout VMID déjà utilisé
      ansible.builtin.command: "qm status {{ item }}"
      loop: [1770, 1771]
      register: vmid_checks
      changed_when: false
      failed_when: false
    - name: Bloquer en cas de collision de VMID
      ansible.builtin.assert:
        that: "vmid_checks.results | selectattr('rc', 'equalto', 0) | list | length == 0"
        fail_msg: "BLOCKED: a reserved lab VMID is already in use; cleanup never deletes pre-existing VMs."
    - name: Créer la VM Windows de lab avec les périphériques requis
      ansible.builtin.command: >-
        qm create 1770 --name pve-integrer-windows-1770 --ostype win11
        --machine q35 --bios ovmf --cpu host --cores 2 --memory 4096
        --scsihw virtio-scsi-single
        --scsi0 local:64,format=qcow2
        --efidisk0 local:1,format=qcow2,efitype=4m,pre-enrolled-keys=1
        --tpmstate0 local:1,version=v2.0
        --net0 virtio,bridge=vmbr0 --agent 1
        --ide2 local:iso/windows-authorized.iso,media=cdrom
        --sata0 local:iso/virtio-win.iso,media=cdrom
        --tags pve-integrer-windows
      changed_when: true

    - name: Créer le répertoire dédié
      ansible.builtin.file:
        path: /opt/lab-proxmox/pve-integrer-windows
        state: directory
        owner: root
        group: root
        mode: '0750'
    - name: Écrire le manifeste borné
      ansible.builtin.copy:
        dest: /opt/lab-proxmox/pve-integrer-windows/manifest.json
        owner: root
        group: root
        mode: '0640'
        content: '{{ {"lab": "pve-integrer-windows", "vmids": [1770, 1771], "template_vmid": null} | to_json }}'
