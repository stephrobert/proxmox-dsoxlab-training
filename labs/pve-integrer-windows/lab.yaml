# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: pve-integrer-windows
title: "Operate a Windows VM with VirtIO"
level: l3
description: |
  Use only a Windows ISO you are licensed and authorized to use and the official VirtIO driver ISO. Install a supported selected build, load disk/network drivers, verify guest agent and network after reboot, remove installation media, and restore a backup that includes EFI and TPM state.
skills:
  - proxmox
  - automation
  - operations
distros:
  - debian13
doc_url: https://pve.proxmox.com/pve-docs/
lab_type: lab
difficulty: advanced
estimated_time: 60m
runtime:
  type: vm
  targets:
    - name: pve
      host: pve.lab
      label_en: "Existing Proxmox VE node; feature prerequisites are checked, never installed"
      label_fr: "Nœud Proxmox VE existant ; les prérequis sont vérifiés, jamais installés"
  default: pve
validation:
  functional: true
  persistence_after_reboot: false
